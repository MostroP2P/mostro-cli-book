[build]
create-missing = false

[book]
title = "mostro-cli JSON Interface"
description = "How to drive mostro-cli from a program: commands, the JSON outcome envelope, every field, error and example."
authors = ["Mostro contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/arkanoider/mostro-cli-book"
edit-url-template = "https://github.com/arkanoider/mostro-cli-book/edit/main/{path}"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.fold]
enable = true
level = 1
